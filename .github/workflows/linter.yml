name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: [self-hosted, linux, X64]
    container: ubuntu:24.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Bootstrap container (lsb-release + git)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates lsb-release libsqlite3-0 libffi8 libssl3 libbz2-1.0 liblzma5 zlib1g libgdbm6t64 libreadline8t64 libncursesw6
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: [self-hosted, linux, X64]
    container: ubuntu:24.04

    steps:
      - name: Bootstrap container (lsb-release + git)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates lsb-release libsqlite3-0 libffi8 libssl3 libbz2-1.0 liblzma5 zlib1g libgdbm6t64 libreadline8t64 libncursesw6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .
